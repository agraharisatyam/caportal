<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CACampus — Updating</title>
<style>
  body{margin:0;font-family:Inter,sans-serif;background:#0d1f33;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;}
  .box{padding:2rem;}
  h1{font-size:2rem;color:#d4a017;margin-bottom:.5rem;}
  p{color:rgba(255,255,255,.7);font-size:1rem;}
  .spinner{width:40px;height:40px;border:4px solid rgba(212,160,23,.2);border-top-color:#d4a017;border-radius:50%;animation:spin 1s linear infinite;margin:1.5rem auto;}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="box">
    <div class="spinner"></div>
    <h1>CACampus</h1>
    <p>We're updating the site. Back in a moment.</p>
  </div>
</body>
</html>
