    <!-- Glasses -->
    <rect x="70" y="82" width="24" height="18" rx="4" fill="none" stroke="#d4a017" stroke-width="2.5"/>
    <rect x="106" y="82" width="24" height="18" rx="4" fill="none" stroke="#d4a017" stroke-width="2.5"/>
    <line x1="94" y1="91" x2="106" y2="91" stroke="#d4a017" stroke-width="2.5"/>

    <!-- Eyes -->
    <circle cx="82" cy="91" r="3" fill="#2d1c10"/>
