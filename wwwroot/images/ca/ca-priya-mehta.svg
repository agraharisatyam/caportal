<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="caBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="skinPriya" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0b5"/>
      <stop offset="100%" stop-color="#e8b896"/>
    </linearGradient>
    <filter id="avatarShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#caBg1)"/>
  
  <!-- Female CA Portrait (CA Priya Mehta) -->
  <g filter="url(#avatarShadow)" transform="translate(0, 5)">
    <!-- Hair back -->
    <path d="M 50 70 Q 100 20 150 70 V 130 C 150 140 140 150 130 150 H 70 C 60 150 50 140 50 130 Z" fill="#1e1b18"/>
    <!-- Body / Blazer -->
    <path d="M 40 190 Q 100 135 160 190 V 200 H 40 Z" fill="#0f172a"/>
    <path d="M 75 190 L 100 150 L 125 190 Z" fill="#ffffff"/>
    <path d="M 60 190 L 100 160 L 75 190 Z" fill="#b45309"/>
    <path d="M 140 190 L 100 160 L 125 190 Z" fill="#b45309"/>

    <!-- Neck -->
    <rect x="86" y="125" width="28" height="30" rx="6" fill="url(#skinPriya)"/>

    <!-- Face -->
    <ellipse cx="100" cy="95" rx="36" ry="42" fill="url(#skinPriya)"/>

    <!-- Eyes -->
    <ellipse cx="85" cy="92" rx="4.5" ry="3" fill="#2d1c10"/>
    <ellipse cx="115" cy="92" rx="4.5" ry="3" fill="#2d1c10"/>
    <!-- Eyebrows -->
    <path d="M 78 85 Q 85 81 92 85" stroke="#1e1b18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 108 85 Q 115 81 122 85" stroke="#1e1b18" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 100 92 L 98 103 H 102" stroke="#d49a70" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Smile -->
    <path d="M 88 114 Q 100 124 112 114" stroke="#c2410c" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Hair front bang style -->
    <path d="M 64 80 Q 95 40 136 80 Q 110 50 64 80 Z" fill="#1e1b18"/>

    <!-- Earring -->
    <circle cx="63" cy="98" r="4" fill="#d4a017"/>
    <circle cx="137" cy="98" r="4" fill="#d4a017"/>
  </g>
</svg>
