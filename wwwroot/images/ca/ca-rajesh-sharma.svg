<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="caBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="skinRajesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3c2a2"/>
      <stop offset="100%" stop-color="#e2ab86"/>
    </linearGradient>
    <filter id="avatarShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="96" fill="url(#caBg2)"/>

  <!-- Male CA Portrait (CA Rajesh Sharma) -->
  <g filter="url(#avatarShadow2)" transform="translate(0, 5)">
    <!-- Suit Body -->
    <path d="M 35 190 Q 100 135 165 190 V 200 H 35 Z" fill="#1e3a8a"/>
    <!-- Shirt -->
    <path d="M 78 190 L 100 145 L 122 190 Z" fill="#ffffff"/>
    <!-- Red Tie -->
    <polygon points="96,155 104,155 107,190 93,190" fill="#dc2626"/>

    <!-- Neck -->
    <rect x="85" y="120" width="30" height="30" rx="6" fill="url(#skinRajesh)"/>

    <!-- Face -->
    <ellipse cx="100" cy="92" rx="36" ry="42" fill="url(#skinRajesh)"/>

    <!-- Male Hairstyle -->
    <path d="M 62 80 C 60 42 140 42 138 80 C 130 55 70 55 62 80 Z" fill="#1c1917"/>

    <!-- Eyes -->
    <ellipse cx="84" cy="90" rx="4" ry="3" fill="#1c1917"/>
    <ellipse cx="116" cy="90" rx="4" ry="3" fill="#1c1917"/>
    <!-- Eyebrows -->
    <path d="M 76 83 Q 84 79 92 83" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 108 83 Q 116 79 124 83" stroke="#1c1917" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M 100 90 L 97 102 H 103" stroke="#c8926c" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Confident Smile -->
    <path d="M 88 114 Q 100 122 112 114" stroke="#9a3412" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>
