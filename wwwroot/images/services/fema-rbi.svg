<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="goldFema" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <filter id="shadowFema" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="20" fill="url(#bgFema)"/>
  <circle cx="200" cy="140" r="110" fill="#ffffff" opacity="0.05"/>

  <!-- Globe & RBI Compliance Graphic -->
  <g filter="url(#shadowFema)" transform="translate(100, 30)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="48" rx="16" fill="#047857"/>
    <rect x="0" y="34" width="200" height="14" fill="#047857"/>
    <text x="24" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff">FEMA &amp; RBI COMPLIANCE</text>

    <!-- RBI Central Bank / Globe Graphic -->
    <circle cx="100" cy="115" r="45" fill="none" stroke="url(#goldFema)" stroke-width="3"/>
    <ellipse cx="100" cy="115" rx="45" ry="18" fill="none" stroke="url(#goldFema)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="100" y1="70" x2="100" y2="160" stroke="url(#goldFema)" stroke-width="1.5"/>

    <!-- Exchange Arrows -->
    <path d="M 65 95 Q 100 80 135 95" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M 135 135 Q 100 150 65 135" fill="none" stroke="#3b82f6" stroke-width="3"/>

    <!-- Approved Badge Bottom -->
    <rect x="20" y="175" width="160" height="30" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="100" y="195" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#047857" text-anchor="middle">CROSS-BORDER &amp; NRI TAX</text>
  </g>

  <!-- Currency Symbols Floating -->
  <g transform="translate(45, 80)">
    <circle cx="20" cy="20" r="18" fill="url(#goldFema)"/>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#047857" text-anchor="middle">$</text>
  </g>
  <g transform="translate(325, 160)">
    <circle cx="20" cy="20" r="18" fill="url(#goldFema)"/>
    <text x="20" y="26" font-family="'Inter', sans-serif" font-weight="900" font-size="16" fill="#047857" text-anchor="middle">€</text>
  </g>
</svg>
