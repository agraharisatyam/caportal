<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgIncome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="50%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="goldIncome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="greenIncome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadowInc" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="20" fill="url(#bgIncome)"/>
  <circle cx="60" cy="60" r="100" fill="#10b981" opacity="0.06"/>
  <circle cx="340" cy="220" r="110" fill="#d4a017" opacity="0.07"/>

  <!-- Center Tax Form Graphic -->
  <g filter="url(#shadowInc)" transform="translate(100, 30)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="50" rx="16" fill="url(#greenIncome)"/>
    <rect x="0" y="36" width="200" height="14" fill="url(#greenIncome)"/>
    <text x="24" y="32" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff">ITR FILING 2025-26</text>

    <!-- Content Bar Rows -->
    <rect x="24" y="70" width="90" height="8" rx="4" fill="#e2e8f0"/>
    <rect x="130" y="70" width="46" height="8" rx="4" fill="#10b981"/>

    <rect x="24" y="92" width="110" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="24" y="106" width="130" height="6" rx="3" fill="#f1f5f9"/>
    <rect x="24" y="120" width="80" height="6" rx="3" fill="#f1f5f9"/>

    <!-- Green Approved Refund Box -->
    <rect x="20" y="142" width="160" height="56" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="44" cy="170" r="14" fill="#10b981"/>
    <polyline points="38,170 42,174 50,165" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="164" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#047857">MAX REFUND CLAIMED</text>
    <text x="68" y="182" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#065f46">₹48,500 REFUND</text>
  </g>

  <!-- Gold Calculator Floating -->
  <g filter="url(#shadowInc)" transform="translate(45, 120)">
    <rect x="0" y="0" width="70" height="100" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <rect x="10" y="12" width="50" height="20" rx="4" fill="#0f172a"/>
    <text x="54" y="27" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#10b981" text-anchor="end">0.00</text>
    <circle cx="20" cy="46" r="5" fill="url(#goldIncome)"/>
    <circle cx="35" cy="46" r="5" fill="url(#goldIncome)"/>
    <circle cx="50" cy="46" r="5" fill="url(#goldIncome)"/>
    <circle cx="20" cy="62" r="5" fill="url(#goldIncome)"/>
    <circle cx="35" cy="62" r="5" fill="url(#goldIncome)"/>
    <circle cx="50" cy="62" r="5" fill="url(#goldIncome)"/>
    <circle cx="20" cy="78" r="5" fill="url(#goldIncome)"/>
    <rect x="30" y="73" width="25" height="10" rx="5" fill="#10b981"/>
  </g>
</svg>
