<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="goldStart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <linearGradient id="rocketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="shadowStart" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="20" fill="url(#bgStart)"/>
  <circle cx="300" cy="180" r="100" fill="#ff416c" opacity="0.08"/>

  <!-- Rocket Launch & Fundraise Graphic -->
  <g filter="url(#shadowStart)" transform="translate(70, 30)">
    <!-- Dashboard Card Background -->
    <rect x="0" y="0" width="260" height="210" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="0" y="0" width="260" height="42" rx="16" fill="#0f172a"/>
    <rect x="0" y="28" width="260" height="14" fill="#0f172a"/>
    <text x="24" y="28" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#f0c040">STARTUP FUNDRAISING &amp; VALUATION</text>

    <!-- Growth Graph Curve -->
    <path d="M 30 160 Q 80 150 120 110 T 230 60" fill="none" stroke="url(#goldStart)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 30 160 Q 80 150 120 110 T 230 60 L 230 170 L 30 170 Z" fill="url(#goldStart)" opacity="0.12"/>

    <!-- Graph Nodes -->
    <circle cx="30" cy="160" r="5" fill="#f0c040"/>
    <circle cx="120" cy="110" r="5" fill="#f0c040"/>
    <circle cx="230" cy="60" r="7" fill="#10b981"/>

    <!-- Funding Raised Pill -->
    <rect x="20" y="175" width="220" height="26" rx="6" fill="#0f172a"/>
    <text x="130" y="192" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#10b981" text-anchor="middle">₹10M+ SEED / SERIES-A FUNDING ADVISORY</text>
  </g>

  <!-- Rocket Graphic Floating -->
  <g filter="url(#shadowStart)" transform="translate(230, 45)">
    <!-- Rocket Body -->
    <path d="M 40 0 C 60 20 60 50 50 80 L 30 80 C 20 50 20 20 40 0 Z" fill="url(#rocketGrad)"/>
    <!-- Fins -->
    <path d="M 20 60 L 5 80 L 25 80 Z" fill="#d97706"/>
    <path d="M 60 60 L 75 80 L 55 80 Z" fill="#d97706"/>
    <!-- Window -->
    <circle cx="40" cy="35" r="10" fill="#ffffff"/>
    <circle cx="40" cy="35" r="7" fill="#0b132b"/>
    <!-- Flame -->
    <path d="M 32 80 L 40 105 L 48 80 Z" fill="#f59e0b"/>
  </g>
</svg>
