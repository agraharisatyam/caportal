<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="goldLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="redLit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadowLit" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="20" fill="url(#bgLit)"/>
  <circle cx="200" cy="140" r="110" fill="#d4a017" opacity="0.05"/>

  <!-- Legal Scales & Notice Reply Graphic -->
  <g filter="url(#shadowLit)" transform="translate(100, 30)">
    <!-- Legal Document -->
    <rect x="20" y="10" width="160" height="200" rx="14" fill="#ffffff"/>
    <rect x="20" y="10" width="160" height="42" rx="14" fill="url(#goldLit)"/>
    <rect x="20" y="42" width="160" height="10" fill="url(#goldLit)"/>
    <text x="36" y="36" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#0d1f33">ITAT &amp; HC APPEALS</text>

    <!-- Lines -->
    <rect x="40" y="66" width="70" height="7" rx="3.5" fill="#e2e8f0"/>
    <rect x="120" y="66" width="40" height="7" rx="3.5" fill="#d4a017"/>

    <rect x="40" y="84" width="120" height="5" rx="2.5" fill="#f1f5f9"/>
    <rect x="40" y="96" width="100" height="5" rx="2.5" fill="#f1f5f9"/>
    <rect x="40" y="108" width="110" height="5" rx="2.5" fill="#f1f5f9"/>

    <!-- Notice Dismissed Stamp -->
    <g transform="translate(35, 130)">
      <rect x="0" y="0" width="130" height="45" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="65" y="22" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#dc2626" text-anchor="middle">NOTICE DISMISSED</text>
      <text x="65" y="37" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#166534" text-anchor="middle">100% RELIEF GRANTED</text>
    </g>
  </g>

  <!-- Scales of Justice Floating -->
  <g filter="url(#shadowLit)" transform="translate(45, 90)">
    <line x1="35" y1="10" x2="35" y2="70" stroke="url(#goldLit)" stroke-width="4"/>
    <line x1="10" y1="20" x2="60" y2="20" stroke="url(#goldLit)" stroke-width="4"/>
    <!-- Left Scale -->
    <line x1="15" y1="20" x2="5" y2="45" stroke="#f0c040" stroke-width="1.5"/>
    <line x1="15" y1="20" x2="25" y2="45" stroke="#f0c040" stroke-width="1.5"/>
    <path d="M 0 45 Q 15 55 30 45 Z" fill="url(#goldLit)"/>

    <!-- Right Scale -->
    <line x1="55" y1="20" x2="45" y2="45" stroke="#f0c040" stroke-width="1.5"/>
    <line x1="55" y1="20" x2="65" y2="45" stroke="#f0c040" stroke-width="1.5"/>
    <path d="M 40 45 Q 55 55 70 45 Z" fill="url(#goldLit)"/>
    <rect x="20" y="68" width="30" height="8" rx="3" fill="url(#goldLit)"/>
  </g>
</svg>
