<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="goldTP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <filter id="shadowTP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="400" height="280" rx="20" fill="url(#bgTP)"/>
  <circle cx="340" cy="220" r="100" fill="#6366f1" opacity="0.1"/>

  <!-- Transfer Pricing Graphic -->
  <g filter="url(#shadowTP)" transform="translate(90, 30)">
    <rect x="0" y="0" width="220" height="220" rx="16" fill="#ffffff"/>
    <rect x="0" y="0" width="220" height="48" rx="16" fill="#3730a3"/>
    <rect x="0" y="34" width="220" height="14" fill="#3730a3"/>
    <text x="24" y="30" font-family="'Inter', sans-serif" font-weight="800" font-size="14" fill="#ffffff">TRANSFER PRICING AUDIT</text>

    <!-- Global Connection Flow Diagram -->
    <rect x="25" y="70" width="70" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="60" y="96" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#1e1b4b" text-anchor="middle">PARENT CO.</text>
    <text x="60" y="114" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#6366f1" text-anchor="middle">USA / UK</text>

    <rect x="125" y="70" width="70" height="60" rx="10" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
    <text x="160" y="96" font-family="'Inter', sans-serif" font-weight="800" font-size="10" fill="#1e1b4b" text-anchor="middle">INDIAN SUB.</text>
    <text x="160" y="114" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#4338ca" text-anchor="middle">INDIA</text>

    <!-- Exchange Double Arrows -->
    <line x1="95" y1="90" x2="125" y2="90" stroke="url(#goldTP)" stroke-width="3"/>
    <polygon points="125,90 118,85 118,95" fill="#d4a017"/>
    <line x1="125" y1="110" x2="95" y2="110" stroke="url(#goldTP)" stroke-width="3"/>
    <polygon points="95,110 102,105 102,115" fill="#d4a017"/>

    <!-- Form 3CEB Audit Report Pill -->
    <rect x="20" y="150" width="180" height="50" rx="10" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
    <text x="110" y="172" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#6b21a8" text-anchor="middle">FORM 3CEB CERTIFICATE</text>
    <text x="110" y="188" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#166534" text-anchor="middle">✓ BENCHMARKING &amp; ALP DONE</text>
  </g>
</svg>
