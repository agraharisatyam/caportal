    <rect x="5" y="18" width="50" height="4" fill="#f0c040"/>
    <!-- Pillars -->
    <rect x="10" y="24" width="6" height="24" rx="1" fill="url(#goldWcu8)"/>
    <rect x="22" y="24" width="6" height="24" rx="1" fill="url(#goldWcu8)"/>
    <rect x="34" y="24" width="6" height="24" rx="1" fill="url(#goldWcu8)"/>
    <rect x="44" y="24" width="6" height="24" rx="1" fill="url(#goldWcu8)"/>
    <!-- Base -->
    <rect x="5" y="48" width="50" height="6" rx="2" fill="#f0c040"/>
