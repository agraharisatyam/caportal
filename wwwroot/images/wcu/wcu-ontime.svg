<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldWcu3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4a017" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0d1117" stroke="url(#goldWcu3)" stroke-width="2"/>
  <circle cx="60" cy="60" r="44" fill="rgba(212,160,23,0.08)"/>

  <!-- Clock & Speed Rays -->
  <g filter="url(#glow3)" transform="translate(30, 30)">
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#goldWcu3)" stroke-width="4"/>
    <polyline points="30,14 30,30 42,30" fill="none" stroke="#f0c040" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="30" r="4" fill="#f0c040"/>
    <!-- Speed Lines -->
    <line x1="2" y1="12" x2="10" y2="16" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="30" x2="8" y2="30" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/>
    <line x1="2" y1="48" x2="10" y2="44" stroke="#f0c040" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
