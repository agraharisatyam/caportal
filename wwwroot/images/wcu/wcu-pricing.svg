<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldWcu4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#f0c040"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#d4a017" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="60" cy="60" r="54" fill="#0d1117" stroke="url(#goldWcu4)" stroke-width="2"/>
  <circle cx="60" cy="60" r="44" fill="rgba(212,160,23,0.08)"/>

  <!-- Indian Rupee Coin Graphic -->
  <g filter="url(#glow4)" transform="translate(30, 30)">
    <circle cx="30" cy="30" r="26" fill="url(#goldWcu4)"/>
    <circle cx="30" cy="30" r="22" fill="#0d1117" stroke="#d4a017" stroke-width="1.5"/>
    <text x="30" y="38" font-family="'Inter', sans-serif" font-weight="900" font-size="24" fill="url(#goldWcu4)" text-anchor="middle">₹</text>
  </g>
</svg>
